# =============================================================================
# Dataset Generator — configuration
#
# EVERYTHING HERE RUNS AGAINST A **LOCAL LLM**. No cloud provider is contacted
# for generation or embeddings. The only outbound traffic is to the sources you
# explicitly list (web crawl targets, your Confluence host).
# =============================================================================

[project]
name         = "pcai-dataset"
description  = "Training/RAG dataset for the Kalam PCAI assistant"
data_dir     = "data"          # relative to this file
language     = "en"

# -----------------------------------------------------------------------------
# LOCAL LLM. Default is Ollama on this machine.
#   ollama serve
#   ollama pull nomic-embed-text          # needed for semantic dedupe
#
# `model` is set to qwen2.5-coder:7b because it is already installed here and
# is reliable at emitting the strict JSON these prompts ask for. gemma4:latest
# (9.6 GB) gives noticeably better answers if you can spare the VRAM/time —
# swap it in and re-run. Check what you have with: python -m datagen doctor
#
# `provider = "openai_compat"` works for LM Studio / llama.cpp / vLLM — still
# local, just a different URL. There is deliberately no hosted-API provider.
# -----------------------------------------------------------------------------
[llm]
provider     = "ollama"                    # ollama | openai_compat | none
base_url     = "http://localhost:11434"
model        = "qwen2.5-coder:7b"
temperature  = 0.2
num_ctx      = 8192
timeout      = 180
max_retries  = 2
# When the local model is down, the pipeline does NOT fail: it falls back to
# deterministic extractive generation. Set false to hard-fail instead.
allow_extractive_fallback = true

[llm.embeddings]
enabled  = true
model    = "nomic-embed-text"
# Embeddings are used for semantic near-duplicate detection and coverage gaps.

# Vision. Screenshots and diagrams cannot be parsed, only described — this model
# describes them and that description becomes the document's text. Applies to
# images in corpus/docs, images the crawler finds, and Confluence attachments.
#
# READ THE README SECTION BEFORE TRUSTING THIS. A description is the only source
# an image record has, so a misread cannot be caught by the grounding check the
# way a bad answer about a PDF can. Measured here, moondream turned
# "503 Service Unavailable" into "5003 SERVICE UNABILIOUS" and invented a disk
# space error that was not in the picture.
#
# Measured on a clean PNG reading "ERROR: MLIS endpoint returned / 503 Service
# Unavailable / pod mlis-7f9c in CrashLoopBackOff":
#
#   gemma4     every identifier correct, nothing invented        ~45s/image
#   moondream  read "503" as "5003", invented a disk-space error  ~5s/image
#   llava      invented "Unable to connect to server" wholesale  ~25s/image
#
# So: gemma4. It is slow per image, and that is the right trade — a wrong
# transcription cannot be caught later, because the description IS the source.
# The model is resolved against what Ollama reports it can do, so "gemma4" finds
# gemma4:12b or gemma4:latest, whichever this machine has.
#
# If no vision-capable model is installed, images are skipped with one log line.
[llm.vision]
enabled   = true
model     = "gemma4"
max_bytes = 12582912             # 12 MB ceiling per image

# -----------------------------------------------------------------------------
# Chunking
# -----------------------------------------------------------------------------
[chunking]
max_chars     = 1600
overlap       = 200
min_chars     = 220        # drop fragments smaller than this
respect_headings = true

# -----------------------------------------------------------------------------
# Deduplication
# -----------------------------------------------------------------------------
[dedupe]
exact          = true
near           = true
simhash_bits   = 6      # max hamming distance treated as a near-duplicate
semantic       = true   # requires embeddings
semantic_threshold = 0.94

# -----------------------------------------------------------------------------
# Generation: what kinds of records to synthesise from each chunk
# -----------------------------------------------------------------------------
[generation]
# qa | instruction | troubleshooting | glossary
# `glossary` extracts defined terms; they are merged corpus-wide into
# exports/GLOSSARY.md rather than staying one row per chunk.
kinds              = ["qa", "instruction", "troubleshooting", "glossary"]
# Split across the kinds a chunk qualifies for (usually 3), so 6 means roughly
# two examples per kind per chunk. Raise `llm.num_ctx` before raising this much
# further, or long answers start getting cut off mid-sentence.
pairs_per_chunk    = 6
max_workers        = 4
include_citations  = true       # every record carries source url/title/chunk id
skip_if_unchanged  = true       # incremental: only regenerate for changed chunks
# Write results to disk every N chunks. Generation runs about a minute per chunk
# on a 7B model, so a 100-chunk run is hours long; without checkpoints a Ctrl-C
# at 95% throws away 95% of the work. Each checkpoint is complete and is skipped
# on the next run, so an interrupt costs at most this many chunks.
checkpoint_every   = 25

# -----------------------------------------------------------------------------
# Quality gate (LLM-as-judge, also local)
# -----------------------------------------------------------------------------
[quality]
enabled          = true
min_score        = 0.6      # 0..1, records below this are quarantined not deleted
require_grounded = true     # answer must be supported by its source chunk
max_answer_chars = 2000
min_question_chars = 12

# -----------------------------------------------------------------------------
# SOURCES
# -----------------------------------------------------------------------------

# Local documents: PDFs, DOCX, PPTX, XLSX, MD, TXT, HTML, CSV, JSON, code.
# DROP YOUR FILES IN `corpus/docs/` — subfolders are walked too, so you can
# organise them however you like. Anything matching a glob below is picked up
# on the next `datagen build`.
[[sources.files]]
name    = "local-docs"
path    = "corpus/docs"
globs   = [
  "**/*.pdf", "**/*.docx", "**/*.pptx", "**/*.xlsx",
  "**/*.md", "**/*.txt", "**/*.html", "**/*.csv", "**/*.json",
  # Screenshots and diagrams: described by the local vision model
  # ([llm.vision]) and the description is used as the document text.
  "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.webp",
]
tags    = ["docs"]

# Runbooks get their own connector: procedures are parsed step-wise so the
# generated records preserve ordering and preconditions.
[[sources.runbooks]]
name    = "ops-runbooks"
path    = "corpus/runbooks"
globs   = ["**/*.md", "**/*.txt", "**/*.pdf", "**/*.docx"]
tags    = ["runbook", "ops"]

# Confluence. Credentials come from the environment, never from this file:
#   CONFLUENCE_BASE_URL, CONFLUENCE_USER, CONFLUENCE_TOKEN
[[sources.confluence]]
name       = "wiki"
enabled    = true
# YOUR SPACE KEYS — the short code in the page URL, e.g. /wiki/spaces/OPS/pages/...
# These are checked against the wiki at run time: keys that do not exist are
# reported along with the list of spaces your token CAN read, and the search
# falls back to `text_search` below rather than silently returning nothing.
spaces     = ["PCAI", "OPS"]
# Used when none of the `spaces` above exist — searches every readable space for
# pages mentioning these. This is what makes the connector useful on a wiki you
# have access to but have not catalogued yet.
text_search = [
  "Private Cloud AI", "PCAI", "MLIS", "MLDM", "MLDE", "Ezmeral",
  "AI Essentials", "runbook", "troubleshooting",
]
cql        = ""                  # optional raw CQL; overrides everything above
# Start small. Raise this once you have seen what a run produces — 500 pages is
# hours of generation on a local 7B model.
max_pages  = 100
include_attachments = true       # pulls PDF/DOCX attachments through the file parsers
# Only pages edited since this point. "-30d", "-6m" or "2026-01-01".
# Leave empty for everything.
updated_since = ""
tags       = ["confluence"]

# Direct web crawl targets.
[[sources.web]]
name       = "hpe-pcai-docs"
enabled    = true
seeds      = [
  "https://developer.hpe.com/platform/hpe-private-cloud-ai/home/",
  "https://developer.hpe.com/platform/hpe-ezmeral-unified-analytics/home/",
  "https://developer.hpe.com/platform/hpe-greenlake/home/",
]
allow_domains = ["developer.hpe.com", "docs.ai-solutions.ext.hpe.com"]
# The first run wasted a third of its budget on Events, Training, Slack-signup
# and newsletter pages — nav furniture with no technical content. These are the
# paths that produced nothing useful.
deny_patterns = [
  "/login", "/search", "\\.zip$", "\\.png$", "\\.jpe?g$", "\\.svg$", "\\.mp4$",
  "/events?/", "/training/", "/newsletter/", "/slack-signup", "/community/",
  "/campaign/", "/uploads/", "\\?", "/tag/", "/author/", "/page/\\d+",
]
max_pages  = 120
max_depth  = 3
delay_ms   = 800                 # be polite
respect_robots = true
tags       = ["web", "vendor-docs"]

# Keyword-driven discovery: the agent searches the web for these and decides
# what is worth scraping. Add a keyword and re-run — it expands on its own.
[sources.keywords]
enabled  = true
engine   = "searxng"          # searxng | duckduckgo — see searxng/setup.py
searxng_url = "http://localhost:8888"   # falls back to DuckDuckGo if unreachable
results_per_keyword = 8
max_pages_per_keyword = 6
# Three keywords produced a 60-record dataset — far below the ~500 a fine-tune
# needs. These cover the PCAI stack component by component, weighted toward
# failure modes because that is what the assistant is asked about.
terms = [
  "HPE Private Cloud AI troubleshooting",
  "HPE Private Cloud AI architecture components",
  "HPE AI Essentials administration guide",
  "HPE Ezmeral Unified Analytics troubleshooting",
  "MLIS deployment error",
  "MLIS endpoint 503 unavailable",
  "MLDE Determined AI experiment failure",
  "Pachyderm MLDM pipeline failure",
  "NVIDIA NIM inference microservice error",
  "kubernetes pod CrashLoopBackOff diagnose fix",
  "kubernetes ImagePullBackOff private registry fix",
  "kubernetes pod OOMKilled troubleshooting",
  "kubernetes PersistentVolumeClaim pending troubleshooting",
  "GPU operator driver pod failure kubernetes",
  "istio ingress gateway 503 upstream connect error",
  "keycloak SSO authentication failure troubleshooting",
]

# -----------------------------------------------------------------------------
# Agent: the autonomous controller
# -----------------------------------------------------------------------------
[agent]
enabled        = true
max_steps      = 24
max_tool_errors = 5
# Objective the planner optimises for. Plain English — it is fed to the local LLM.
objective = """
Build and continuously improve a high-quality dataset about HPE Private Cloud AI:
its architecture, installation, day-2 operations, and above all how to diagnose
and fix errors. Prefer primary vendor documentation and internal runbooks over
blogs. Find and close coverage gaps.
"""
# Self-improvement: after each run the agent proposes new keywords/URLs from
# gaps it found. Written to data/state.db and used on the next run.
propose_new_sources = true
max_proposed_per_run = 10

# -----------------------------------------------------------------------------
# Scheduler: "it updates itself"
# -----------------------------------------------------------------------------
[schedule]
enabled       = true
interval_min  = 360           # re-check every 6h
full_rebuild_every = 14       # every Nth cycle, ignore caches and rebuild
jitter_pct    = 10

# -----------------------------------------------------------------------------
# Export
# -----------------------------------------------------------------------------
[export]
formats   = ["jsonl", "alpaca", "sharegpt", "chatml", "rag_chunks", "glossary"]
out_dir   = "exports"
split     = { train = 0.9, eval = 0.1 }
shuffle_seed = 42
# Push straight into the Kalam PCAI assistant's learned-docs file so the
# existing chatbot picks it up on the next "Train".
kalam_kb_path = "../server/pcai/learned.json"
