# Local SearXNG for the dataset generator.
#
#   python searxng/setup.py          start it (generates the secret, verifies JSON)
#   docker compose -f searxng/docker-compose.yml down     stop it
#
# Bound to 127.0.0.1 only — this instance is not reachable from the network.

services:
  searxng:
    image: searxng/searxng:latest
    container_name: datagen-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
    cap_drop:
      - ALL
    cap_add:
      # The entrypoint drops privileges after fixing up file ownership.
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
